# ResolveAI / ARRA — full stack orchestration (spec §8.1)
#   api       : FastAPI backend (port 8000)
#   tools     : standalone mock connector service (port 9100, same image)
#   frontend  : multi-stage nginx build serving the dashboard (host port 5173)
#   redis     : ephemeral agent state store
#   db        : PostgreSQL audit ledger
#
# Start with:  docker-compose up --build
# UI:          http://localhost:5173    API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arra
      POSTGRES_PASSWORD: arra
      POSTGRES_DB: arra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arra -d arra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tools:
    build: ./backend
    command: uvicorn app.tools.mock_service:app --host 0.0.0.0 --port 9100
    expose:
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9100/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://arra:arra@db:5432/arra
      STATE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      TOOL_BASE_URL: http://tools:9100
      JWT_SECRET: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tools:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
